name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bazel
        uses: bazelbuild/setup-bazelisk@v3
      - name: Build
        run: bazel build //...
      - name: Test
        run: bazel test //...
